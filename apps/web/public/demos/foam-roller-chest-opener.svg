<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t">
  <title id="t">Foam roller chest opener: lying lengthwise on a foam roller, knees bent, arms open from the chest into a goalpost and rest toward the floor.</title>
  <!--
    Exercise demo for the Follow-along player. Top-down view, head to the left,
    with a side-view inset. Colors are the app theme (theme.css): bg, surface,
    raised, line, ink, muted, accent (work) and rest (the roller).
    The un-animated pose is the hold (goalpost), so reduced motion still reads.
  -->
  <style>
    .loop { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .upper { animation-name: upper; }
    .fore { animation-name: fore; }
    .side-arm { animation-name: side-arm; }
    .chest { animation-name: breathe; }
    .glow { animation-name: glow; }

    @keyframes upper {
      0%, 12% { transform: rotate(-88deg); }
      38%, 84% { transform: rotate(0deg); }
      98%, 100% { transform: rotate(-88deg); }
    }
    @keyframes fore {
      0%, 12% { transform: rotate(155deg); }
      38%, 84% { transform: rotate(0deg); }
      98%, 100% { transform: rotate(155deg); }
    }
    @keyframes side-arm {
      0%, 12% { transform: scaleY(-1); }
      38%, 84% { transform: scaleY(1); }
      98%, 100% { transform: scaleY(-1); }
    }
    @keyframes breathe {
      0%, 42% { transform: scale(1, 1); }
      52% { transform: scale(1.02, 1.05); }
      62% { transform: scale(1, 1); }
      72% { transform: scale(1.02, 1.05); }
      82%, 100% { transform: scale(1, 1); }
    }
    @keyframes glow {
      0%, 25% { opacity: 0; }
      42%, 84% { opacity: 0.55; }
      96%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .loop { animation: none; }
    }
  </style>

  <defs>
    <radialGradient id="pec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c8ff2e" stop-opacity="1" />
      <stop offset="1" stop-color="#c8ff2e" stop-opacity="0" />
    </radialGradient>

  </defs>

  <rect width="640" height="360" fill="#16181b" />

  <!-- Mat -->
  <rect x="40" y="28" width="560" height="304" rx="18" fill="#1f2226" />

  <!-- Legs: knees bent, feet flat. Thighs rise toward the viewer, so they look short. -->
  <g stroke="#c9cdd2" stroke-linecap="round">
    <line x1="388" y1="162" x2="478" y2="146" stroke-width="28" />
    <line x1="388" y1="198" x2="478" y2="214" stroke-width="28" />
  </g>
  <g fill="#9ca3aa">
    <ellipse cx="516" cy="144" rx="19" ry="9" />
    <ellipse cx="516" cy="216" rx="19" ry="9" />
  </g>
  <g fill="#f3f5ef">
    <circle cx="482" cy="146" r="15" />
    <circle cx="482" cy="214" r="15" />
  </g>


  <!-- Torso and head -->
  <g transform="translate(280 180)">
    <g class="chest loop">
      <path
        transform="translate(-280 -180)"
        d="M160 170 C168 150 176 128 200 128 C226 130 300 140 322 147 C358 142 394 141 404 152 C414 166 414 194 404 208 C394 219 358 218 322 213 C300 220 226 230 200 232 C176 232 168 210 160 190 Z"
        fill="#c9cdd2"
      />
      <g class="glow loop" transform="translate(-280 -180)" opacity="0.55">
        <ellipse cx="226" cy="156" rx="30" ry="22" fill="url(#pec)" />
        <ellipse cx="226" cy="204" rx="30" ry="22" fill="url(#pec)" />
      </g>
    </g>
  </g>
  <circle cx="132" cy="180" r="25" fill="#f3f5ef" />

  <!-- Arms, drawn in the hold: upper arm out from the shoulder, forearm toward the head.
       They start with the hands on the chest, so they sit over the torso. -->
  <g transform="translate(198 222)">
      <g class="upper loop">
        <line x1="0" y1="0" x2="0" y2="70" stroke="#c8ff2e" stroke-width="20" stroke-linecap="round" />
        <g transform="translate(0 70)">
          <g class="fore loop">
            <line x1="0" y1="0" x2="-58" y2="0" stroke="#c8ff2e" stroke-width="16" stroke-linecap="round" />
            <circle cx="-64" cy="0" r="9.5" fill="#dcff78" />
          </g>
        </g>
      </g>
    </g>
  <g transform="translate(198 138) scale(1 -1)">
      <g class="upper loop">
        <line x1="0" y1="0" x2="0" y2="70" stroke="#c8ff2e" stroke-width="20" stroke-linecap="round" />
        <g transform="translate(0 70)">
          <g class="fore loop">
            <line x1="0" y1="0" x2="-58" y2="0" stroke="#c8ff2e" stroke-width="16" stroke-linecap="round" />
            <circle cx="-64" cy="0" r="9.5" fill="#dcff78" />
          </g>
        </g>
      </g>
    </g>

  <!-- Roller, seen through the body: head to tailbone -->
  <rect x="98" y="160" width="322" height="40" rx="20" fill="none" stroke="#4cc9ff" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 6" />

  <!-- Side view inset -->
  <g transform="translate(466 258)">
    <rect width="122" height="62" rx="10" fill="#0d0e10" stroke="#2b2f34" />
    <text x="10" y="15" fill="#6b7178" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="8" font-weight="700" letter-spacing="1.5">SIDE</text>
    <line x1="6" y1="54" x2="116" y2="54" stroke="#2b2f34" stroke-width="2" />
    <rect x="10" y="42" width="72" height="12" rx="6" fill="#4cc9ff" fill-opacity="0.35" stroke="#4cc9ff" stroke-width="1.5" />
    <g stroke="#c9cdd2" stroke-linecap="round">
      <line x1="22" y1="36" x2="78" y2="36" stroke-width="10" />
      <line x1="80" y1="37" x2="96" y2="20" stroke-width="7" />
      <line x1="96" y1="20" x2="102" y2="51" stroke-width="6" />
      <line x1="102" y1="52" x2="111" y2="52" stroke-width="4" />
    </g>
    <circle cx="16" cy="34" r="6.5" fill="#f3f5ef" />
    <g transform="translate(30 36)">
      <line class="side-arm loop" x1="0" y1="0" x2="0" y2="17" stroke="#c8ff2e" stroke-width="5" stroke-linecap="round" />
    </g>
  </g>
</svg>
